</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps uppercase" for="password">Password</label>
<a class="font-label-caps text-label-caps text-primary underline decoration-2 hover:text-on-background transition-colors" href="#">Forgot?</a>
</div>
<input class="w-full bg-surface-container-lowest border-2 border-on-background p-4 font-label-caps text-label-caps focus:outline-none focus:border-4 focus:shadow-[4px_4px_0px_0px_#a4c639] transition-all" id="password" placeholder="••••••••" type="password">
</div>
