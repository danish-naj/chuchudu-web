<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Chuchudu - Storage Management</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&amp;family=JetBrains+Mono:wght@700&amp;family=Space+Grotesk:wght@700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#f3f3f3",
                        "on-surface-variant": "#454937",
                        "on-secondary-fixed-variant": "#474747",
                        "on-primary-container": "#3e5000",
                        "on-background": "#1a1c1c",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#b1d446",
                        "secondary-fixed": "#e2e2e2",
                        "inverse-on-surface": "#f1f1f1",
                        "background": "#f9f9f9",
                        "secondary-fixed-dim": "#c6c6c6",
                        "on-primary-fixed-variant": "#3c4d00",
                        "inverse-surface": "#2f3131",
                        "surface": "#f9f9f9",
                        "secondary-container": "#e2e2e2",
                        "primary-fixed": "#ccf05f",
                        "surface-tint": "#506600",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#506600",
                        "surface-dim": "#dadada",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#e2e2e2",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#161e00",
                        "primary-container": "#a4c639",
                        "on-tertiary-container": "#484a4a",
                        "outline": "#757965",
                        "secondary": "#5e5e5e",
                        "surface-container-highest": "#e2e2e2",
                        "on-secondary-container": "#646464",
                        "error": "#ba1a1a",
                        "tertiary-container": "#b8b9b9",
                        "on-secondary-fixed": "#1b1b1b",
                        "outline-variant": "#c5c9b1",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#5d5f5f",
                        "on-tertiary-fixed": "#1a1c1c",
                        "on-primary": "#ffffff",
                        "surface-container": "#eeeeee",
                        "inverse-primary": "#b1d446",
                        "on-tertiary-fixed-variant": "#454747",
                        "surface-container-high": "#e8e8e8",
                        "on-surface": "#1a1c1c",
                        "on-error": "#ffffff",
                        "surface-variant": "#e2e2e2",
                        "surface-bright": "#f9f9f9",
                        "tertiary-fixed-dim": "#c6c6c7"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-max": "1280px",
                        "margin-mobile": "16px",
                        "margin-desktop": "64px",
                        "gutter": "24px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "label-caps": ["JetBrains Mono"],
                        "headline-lg-mobile": ["Space Grotesk"],
                        "headline-lg": ["Space Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "display-lg": ["Space Grotesk"],
                        "headline-md": ["Space Grotesk"],
                        "button-text": ["Space Grotesk"],
                        "body-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "fontWeight": "700" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "headline-lg": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "display-lg": ["72px", { "lineHeight": "72px", "letterSpacing": "-0.04em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "button-text": ["18px", { "lineHeight": "20px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Neo-Brutalist Utilities */
        .neo-border { border: 2px solid #1a1c1c; }
        .neo-border-thick { border: 3px solid #1a1c1c; }
        .neo-shadow { box-shadow: 4px 4px 0px 0px rgba(26,28,28,1); }
        .neo-shadow-lg { box-shadow: 8px 8px 0px 0px rgba(26,28,28,1); }
        
        .neo-btn-hover { transition: transform 0.1s, box-shadow 0.1s; }
        .neo-btn-hover:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px 0px rgba(26,28,28,1) !important;
        }

        /* Storage Bar Colors */
        .bar-photos { background-color: #ff3366; }
        .bar-videos { background-color: #33ccff; }
        .bar-docs { background-color: #ffcc00; }
        .bar-other { background-color: #cc66ff; }
        .bar-free { background-color: #ffffff; }

    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-24 selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-surface border-b-4 border-on-background shadow-[4px_0px_0px_0px_rgba(0,0,0,1)]">
<div class="flex items-center justify-between px-margin-mobile py-4 w-full">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full neo-border overflow-hidden bg-secondary-fixed">
<img alt="User profile avatar" class="w-full h-full object-cover" data-alt="A stylized, flat-vector illustration of a user avatar in a neo-brutalist style. Bold black outlines, flat vibrant colors (lime green, neon pink, or cyan) against a white background. The character has a cool, modern expression, wearing trendy geometric glasses. High contrast, clean lines." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCn4mk1yQjz5TG9c-EvDrkkwHxD8moYHFvpKKZ9gF7yE7b2XqMeo8dqf4M0Q7L483Krqdvn9j5A0tJG-qFoBeojNRJaZ7EoYm5c6zaiCHgWnSJj6gakgAPD0v7c34JWAQhu_Lq2fteqQ5vhxjih5WJwrLg6BKHIxFz9GUP3vBmrEj3chJqJUXdSwjGXssI7kg8IBTGdPqoWudrqU-iqrZnCFaBrgXOZRFraP3yi8EQZOBEVeBPiRTeFcuKhwdn2sRQMe9ed05TVAYuH"/>
</div>
</div>
<h1 class="font-headline-md text-headline-md font-black text-on-surface tracking-tighter">CHUCHUDU</h1>
<button aria-label="Settings" class="w-10 h-10 flex items-center justify-center rounded-lg neo-border bg-surface-container-lowest neo-btn-hover hover:bg-primary hover:text-on-primary text-on-surface transition-transform duration-100 active:translate-y-1 active:translate-x-1">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="px-margin-mobile py-6 max-w-container-max mx-auto md:px-margin-desktop grid grid-cols-4 md:grid-cols-8 lg:grid-cols-12 gap-gutter">
<!-- Header Section -->
<div class="col-span-4 md:col-span-8 lg:col-span-12 mb-4">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg font-black uppercase mb-2">Storage</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant border-l-4 border-primary pl-3">Manage your digital junk drawer.</p>
</div>
<!-- Storage Overview Card -->
<div class="col-span-4 md:col-span-8 lg:col-span-12 mb-6">
<div class="bg-surface-container-lowest neo-border-thick neo-shadow-lg p-5 rounded-xl">
<div class="flex justify-between items-end mb-4">
<div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest block mb-1">Used</span>
<div class="font-display-lg text-display-lg leading-none tracking-tighter">45<span class="text-headline-md">GB</span></div>
</div>
<div class="text-right">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest block mb-1">Total</span>
<div class="font-headline-md text-headline-md">100 GB</div>
</div>
</div>
<!-- Chunky Progress Bar -->
<div class="h-10 w-full neo-border-thick rounded-lg flex overflow-hidden mb-4 relative bg-white">
<div class="h-full bar-photos border-r-2 border-on-background" style="width: 40%" title="Photos: 18GB"></div>
<div class="h-full bar-videos border-r-2 border-on-background" style="width: 25%" title="Videos: 11GB"></div>
<div class="h-full bar-docs border-r-2 border-on-background" style="width: 15%" title="Documents: 7GB"></div>
<div class="h-full bar-other border-r-2 border-on-background" style="width: 10%" title="Other: 4GB"></div>
<!-- Remaining is free space -->
</div>
<!-- Legend -->
<div class="grid grid-cols-2 gap-3 mt-4">
<div class="flex items-center gap-2">
<div class="w-4 h-4 neo-border bar-photos"></div>
<span class="font-label-caps text-label-caps">Photos (18GB)</span>
</div>
<div class="flex items-center gap-2">
<div class="w-4 h-4 neo-border bar-videos"></div>
<span class="font-label-caps text-label-caps">Videos (11GB)</span>
</div>
<div class="flex items-center gap-2">
<div class="w-4 h-4 neo-border bar-docs"></div>
<span class="font-label-caps text-label-caps">Docs (7GB)</span>
</div>
<div class="flex items-center gap-2">
<div class="w-4 h-4 neo-border bar-other"></div>
<span class="font-label-caps text-label-caps">Other (4GB)</span>
</div>
</div>
</div>
</div>
<!-- Upgrade CTA -->
<div class="col-span-4 md:col-span-8 lg:col-span-12 mb-8">
<button class="w-full bg-primary-container text-on-primary-container font-button-text text-button-text py-4 px-6 rounded-xl neo-border-thick neo-shadow neo-btn-hover uppercase flex justify-between items-center group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-3xl group-hover:rotate-12 transition-transform" data-icon="rocket_launch">rocket_launch</span>
<span>Upgrade Storage</span>
</div>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Tools Section Title -->
<div class="col-span-4 md:col-span-8 lg:col-span-12 mb-2">
<h3 class="font-headline-md text-headline-md font-bold uppercase border-b-2 border-on-background pb-2">Cleanup Tools</h3>
</div>
<!-- Tool Cards -->
<div class="col-span-2 md:col-span-4 lg:col-span-6 mb-4">
<button class="w-full text-left bg-error-container text-on-error-container p-4 rounded-xl neo-border neo-shadow neo-btn-hover h-full flex flex-col justify-between">
<span class="material-symbols-outlined text-3xl mb-3" data-icon="content_copy">content_copy</span>
<div>
<h4 class="font-headline-md text-headline-md font-bold text-lg mb-1 leading-tight">Delete Duplicates</h4>
<p class="font-label-caps text-label-caps opacity-80">Free up ~2.4 GB</p>
</div>
</button>
</div>
<div class="col-span-2 md:col-span-4 lg:col-span-6 mb-4">
<button class="w-full text-left bg-secondary-container text-on-secondary-container p-4 rounded-xl neo-border neo-shadow neo-btn-hover h-full flex flex-col justify-between">
<span class="material-symbols-outlined text-3xl mb-3" data-icon="mop">mop</span>
<div>
<h4 class="font-headline-md text-headline-md font-bold text-lg mb-1 leading-tight">Clean Cache</h4>
<p class="font-label-caps text-label-caps opacity-80">Free up ~500 MB</p>
</div>
</button>
</div>
<div class="col-span-4 md:col-span-8 lg:col-span-12 mb-8">
<button class="w-full text-left bg-surface-container-lowest p-4 rounded-xl neo-border neo-shadow neo-btn-hover flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-fixed-dim neo-border flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="folder_zip">folder_zip</span>
</div>
<div>
<h4 class="font-headline-md text-headline-md font-bold text-lg leading-tight">Review Large Files</h4>
<p class="font-label-caps text-label-caps text-on-surface-variant">Files over 100MB</p>
</div>
</div>
<span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</main>
<!-- BottomNavBar (Visible on Mobile) -->
<nav class="fixed bottom-0 w-full z-50 md:hidden bg-surface border-t-4 border-on-background shadow-[0_-4px_0px_0px_rgba(0,0,0,1)]">
<div class="flex justify-around items-center w-full h-20 px-margin-mobile">
<button class="flex flex-col items-center justify-center text-on-surface px-4 py-1 hover:bg-primary-fixed transition-all duration-75 active:scale-95 rounded-xl">
<span class="material-symbols-outlined mb-1" data-icon="folder_open">folder_open</span>
<span class="font-label-caps text-label-caps">Files</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface px-4 py-1 hover:bg-primary-fixed transition-all duration-75 active:scale-95 rounded-xl">
<span class="material-symbols-outlined mb-1" data-icon="swap_horiz">swap_horiz</span>
<span class="font-label-caps text-label-caps">Transfers</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface px-4 py-1 hover:bg-primary-fixed transition-all duration-75 active:scale-95 rounded-xl">
<span class="material-symbols-outlined mb-1" data-icon="bolt">bolt</span>
<span class="font-label-caps text-label-caps">Activity</span>
</button>
<!-- Active State -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container border-2 border-on-background rounded-xl px-4 py-1 translate-y-[-4px] shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:bg-primary-fixed transition-all duration-75 active:scale-95">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-caps text-label-caps">Account</span>
</button>
</div>
</nav>
</body></html>
