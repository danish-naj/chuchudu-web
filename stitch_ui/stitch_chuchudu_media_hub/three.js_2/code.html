<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_66 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_66" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_66');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Group to hold our "files"
const group = new THREE.Group();
scene.add(group);

// Create representative "file" geometries
const boxGeom = new THREE.BoxGeometry(1, 1.4, 0.1);
const cylinderGeom = new THREE.CylinderGeometry(0.5, 0.5, 0.1, 32);

const primaryColor = 0xa4c639;
const darkColor = 0x000000;

function createFile(geometry, color, pos) {
    const material = new THREE.MeshPhongMaterial({ 
        color: color, 
        flatShading: true,
        shininess: 100
    });
    const mesh = new THREE.Mesh(geometry, material);
    
    // Add a "border" effect with edges geometry
    const edges = new THREE.EdgesGeometry(geometry);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
    mesh.add(line);
    
    mesh.position.set(pos.x, pos.y, pos.z);
    mesh.userData.initialPos = pos.clone();
    mesh.userData.rotationSpeed = Math.random() * 0.02;
    group.add(mesh);
    return mesh;
}

const files = [];
for(let i = 0; i < 8; i++) {
    const isBox = Math.random() > 0.5;
    const geom = isBox ? boxGeom : cylinderGeom;
    const color = Math.random() > 0.3 ? primaryColor : 0xffffff;
    const pos = new THREE.Vector3(
        (Math.random() - 0.5) * 10,
        (Math.random() - 0.5) * 10,
        (Math.random() - 0.5) * 5 - 5
    );
    files.push(createFile(geom, color, pos));
}

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 5, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040));

camera.position.z = 8;

const mouse = new THREE.Vector2();
window.addEventListener('mousemove', (event) => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
});

function animate() {
    requestAnimationFrame(animate);
    
    const time = Date.now() * 0.001;
    
    files.forEach((file, i) => {
        file.rotation.x += file.userData.rotationSpeed;
        file.rotation.y += file.userData.rotationSpeed;
        
        // Floating motion
        file.position.y = file.userData.initialPos.y + Math.sin(time + i) * 0.5;
        
        // React to mouse
        file.position.x += (mouse.x * 2 - (file.position.x - file.userData.initialPos.x)) * 0.05;
    });

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_66 -->
</body>
</html>
