<!-- Suppressed Shell Navigations because this is a Transactional/Linear page (Sign-up) -->

<p class="font-body-md text-body-md text-on-surface-variant mb-8 text-center">Create your Chuchudu account.</p>
<!-- Sign Up Form -->
<form class="w-full flex flex-col gap-6">
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps uppercase text-on-surface" for="fullName">Full Name</label>
<input class="w-full h-12 px-4 bg-surface-container-lowest neo-border neo-shadow font-label-caps text-label-caps neo-input transition-all placeholder:text-outline" id="fullName" placeholder="JOHN DOE" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps uppercase text-on-surface" for="email">Email Address</label>
<input class="w-full h-12 px-4 bg-surface-container-lowest neo-border neo-shadow font-label-caps text-label-caps neo-input transition-all placeholder:text-outline" id="email" placeholder="JOHN@CHUCHUDU.COM" type="email"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps uppercase text-on-surface" for="password">Password</label>
<input class="w-full h-12 px-4 bg-surface-container-lowest neo-border neo-shadow font-label-caps text-label-caps neo-input transition-all placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps uppercase text-on-surface" for="confirmPassword">Confirm Password</label>
<input class="w-full h-12 px-4 bg-surface-container-lowest neo-border neo-shadow font-label-caps text-label-caps neo-input transition-all placeholder:text-outline" id="confirmPassword" placeholder="••••••••" type="password"/>
</div>
<button class="w-full h-14 bg-primary-container text-on-primary-container font-button-text text-button-text uppercase neo-border neo-shadow neo-button transition-all flex items-center justify-center mt-4" type="button">
                Create Account
            </button>
</form>
<div class="w-full flex items-center gap-4 my-8">
<div class="flex-1 h-[2px] bg-black"></div>
<span class="font-label-caps text-label-caps uppercase text-on-surface">Or</span>
<div class="flex-1 h-[2px] bg-black"></div>
</div>
<!-- Social Logins -->
<div class="w-full flex flex-col gap-4">
<button class="w-full h-12 bg-surface-container-lowest neo-border neo-shadow neo-button transition-all flex items-center justify-center gap-3">
