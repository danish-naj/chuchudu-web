</button>
<h1 class="font-headline-md text-headline-md truncate px-4 max-w-[200px]">Summer_Trip_24.jpg</h1>
<div class="w-12"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col pb-32">
<!-- Image Preview -->
<div class="w-full p-margin-mobile">
<div class="w-full aspect-square neo-border-thick neo-shadow-lg bg-surface-container-highest overflow-hidden relative group">

<!-- Size Card -->

<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Size</span>
<span class="font-headline-md text-headline-md">2.4 GB</span>
</div>
<!-- Type Card -->
<div class="neo-border bg-primary-fixed p-4 flex flex-col gap-2 neo-shadow hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-none transition-all">
<span class="font-label-caps text-label-caps text-on-primary-fixed uppercase">Type</span>
<span class="font-headline-md text-headline-md text-on-primary-fixed">JPG</span>
</div>
</div>
<!-- Date Card -->
<div class="neo-border bg-surface-container-lowest p-4 flex justify-between items-center neo-shadow hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-none transition-all">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Date Added</span>
<span class="font-headline-md text-headline-md">Today</span>
</div>

<p class="font-body-md text-body-md text-on-surface">
