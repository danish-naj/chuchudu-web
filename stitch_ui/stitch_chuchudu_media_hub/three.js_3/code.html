<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_72 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_72" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_72');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const container = document.getElementById('threejs-container-ANIMATION_66');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(devicePixelRatio);
  container.appendChild(renderer.domElement);

  // Group to hold our "files"
  const group = new THREE.Group();
  scene.add(group);

  // Create representative "file" geometries
  const boxGeom = new THREE.BoxGeometry(1.2, 1.6, 0.15);
  const cylinderGeom = new THREE.CylinderGeometry(0.6, 0.6, 0.15, 32);

  const primaryColor = 0xa4c639;
  const darkColor = 0x000000;

  function createFile(geometry, color, pos) {
    const material = new THREE.MeshPhongMaterial({ 
      color: color, 
      flatShading: true,
      shininess: 150
    });
    const mesh = new THREE.Mesh(geometry, material);
    
    // Add a "border" effect with edges geometry - thicker for Neo-Brutalist look
    const edges = new THREE.EdgesGeometry(geometry);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 3 }));
    mesh.add(line);
    
    mesh.position.set(pos.x, pos.y, pos.z);
    mesh.userData.initialPos = pos.clone();
    // Increased rotation speed for "move more"
    mesh.userData.rotationSpeedX = (Math.random() - 0.5) * 0.05;
    mesh.userData.rotationSpeedY = (Math.random() - 0.5) * 0.05;
    mesh.userData.floatSpeed = 0.5 + Math.random() * 1.5;
    mesh.userData.floatAmplitude = 0.5 + Math.random() * 1.0;
    
    group.add(mesh);
    return mesh;
  }

  const files = [];
  for(let i = 0; i < 12; i++) { // Increased count for more activity
    const isBox = Math.random() > 0.5;
    const geom = isBox ? boxGeom : cylinderGeom;
    const color = Math.random() > 0.3 ? primaryColor : 0xffffff;
    const pos = new THREE.Vector3(
      (Math.random() - 0.5) * 12,
      (Math.random() - 0.5) * 12,
      (Math.random() - 0.5) * 8 - 5
    );
    files.push(createFile(geom, color, pos));
  }

  const light = new THREE.DirectionalLight(0xffffff, 1.2);
  light.position.set(5, 10, 7.5);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x606060));

  camera.position.z = 10;

  const mouse = new THREE.Vector2();
  window.addEventListener('mousemove', (event) => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  });

  // Touch support for mobile interaction
  window.addEventListener('touchmove', (event) => {
    if (event.touches.length > 0) {
      mouse.x = (event.touches[0].clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.touches[0].clientY / window.innerHeight) * 2 + 1;
    }
  }, { passive: true });

  function animate() {
    requestAnimationFrame(animate);
    
    const time = Date.now() * 0.001;
    
    files.forEach((file, i) => {
      // More aggressive rotation
      file.rotation.x += file.userData.rotationSpeedX;
      file.rotation.y += file.userData.rotationSpeedY;
      
      // Floating motion with more amplitude and varied frequency
      file.position.y = file.userData.initialPos.y + Math.sin(time * file.userData.floatSpeed + i) * file.userData.floatAmplitude;
      file.position.z = file.userData.initialPos.z + Math.cos(time * 0.5 + i) * 1.0;
      
      // Stronger reaction to mouse/touch - "kinetic" magnetic pull
      const targetX = file.userData.initialPos.x + (mouse.x * 4.0);
      const targetY = file.userData.initialPos.y + (mouse.y * 4.0);
      
      file.position.x += (targetX - file.position.x) * 0.08;
      file.position.y += (targetY - file.position.y) * 0.08;
      
      // Subtle scale pulse based on motion
      const pulse = 1.0 + Math.sin(time * 2.0 + i) * 0.05;
      file.scale.set(pulse, pulse, pulse);
    });

    // Subly tilt the whole group based on mouse
    group.rotation.y += (mouse.x * 0.2 - group.rotation.y) * 0.05;
    group.rotation.x += (-mouse.y * 0.2 - group.rotation.x) * 0.05;

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });

  animate();
})();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_72 -->
</body>
</html>
