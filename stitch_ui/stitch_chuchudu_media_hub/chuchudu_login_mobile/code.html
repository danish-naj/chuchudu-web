<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col md:hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Canvas (Main Content) -->
<main class="flex-grow flex items-center justify-center p-margin-mobile">
<div class="w-full max-w-sm bg-surface-container-lowest border-2 border-on-background shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] p-6 flex flex-col gap-8">
<!-- Brand / Header -->
<div class="flex flex-col items-center gap-2 text-center">
<span class="material-symbols-outlined text-6xl text-primary" style="font-variation-settings: 'FILL' 1;">
                    bolt
                </span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tighter text-on-background uppercase">CHUCHUDU</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase">LOGIN TO CONTINUE</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-4">
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-background uppercase" for="email">Email Address</label>
<input class="w-full bg-surface-container-lowest border-2 border-on-background p-3 font-label-caps text-label-caps text-on-background placeholder:text-on-surface-variant/50 focus:outline-none focus:border-4 focus:border-on-background focus:ring-0 transition-all rounded-none" id="email" placeholder="USER@EXAMPLE.COM" required="" type="email"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-background uppercase" for="password">Password</label>
<input class="w-full bg-surface-container-lowest border-2 border-on-background p-3 font-label-caps text-label-caps text-on-background placeholder:text-on-surface-variant/50 focus:outline-none focus:border-4 focus:border-on-background focus:ring-0 transition-all rounded-none" id="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="flex items-center justify-between mt-2">
<div class="flex items-center gap-2">
<div class="relative flex items-center">
<input class="peer h-5 w-5 appearance-none border-2 border-on-background bg-surface-container-lowest checked:bg-primary rounded-none outline-none focus:ring-0 cursor-pointer" id="remember" type="checkbox"/>
<span class="material-symbols-outlined absolute left-0.5 top-0.5 text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 pointer-events-none" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<label class="font-label-caps text-label-caps text-on-background uppercase cursor-pointer" for="remember">Remember Me</label>
</div>
<a class="font-label-caps text-label-caps text-primary underline decoration-2 hover:text-on-background transition-colors uppercase" href="#">Forgot?</a>
</div>
<button class="w-full bg-primary text-on-primary font-button-text text-button-text uppercase border-2 border-on-background shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] p-4 mt-4 hover:shadow-none hover:translate-y-[4px] hover:translate-x-[4px] transition-all flex items-center justify-center gap-2 group" type="submit">
<span>ENTER SYSTEM</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 w-full">
<div class="flex-grow h-0.5 bg-on-background"></div>
<span class="font-label-caps text-label-caps text-on-background uppercase">OR</span>
<div class="flex-grow h-0.5 bg-on-background"></div>
</div>
<!-- Social Logins -->
<div class="flex flex-col gap-3">
<button class="w-full bg-surface-container-lowest text-on-background font-button-text text-button-text uppercase border-2 border-on-background shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] p-3 hover:shadow-none hover:translate-y-[4px] hover:translate-x-[4px] transition-all flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">language</span>
<span>GOOGLE</span>
</button>
<button class="w-full bg-surface-container-lowest text-on-background font-button-text text-button-text uppercase border-2 border-on-background shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] p-3 hover:shadow-none hover:translate-y-[4px] hover:translate-x-[4px] transition-all flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">code</span>
<span>GITHUB</span>
</button>
</div>
<div class="text-center mt-2">
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase">
                    NO ACCOUNT? <a class="text-primary underline decoration-2 hover:text-on-background transition-colors" href="#">INITIATE SIGN UP</a>
</p>
