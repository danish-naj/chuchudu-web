<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_28 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_28" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_28');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);
const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
directionalLight.position.set(5, 5, 5);
scene.add(directionalLight);

// Group to hold our icons
const iconGroup = new THREE.Group();
scene.add(iconGroup);

// Function to create a 3D "file" (box with accent color)
function createFileIcon(color, position) {
  const geometry = new THREE.BoxGeometry(1, 1.4, 0.2);
  const material = new THREE.MeshPhongMaterial({ color: color });
  const mesh = new THREE.Mesh(geometry, material);
  
  // Add a small "dog-ear" or fold detail
  const foldGeo = new THREE.BoxGeometry(0.3, 0.3, 0.22);
  const foldMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
  const fold = new THREE.Mesh(foldGeo, foldMat);
  fold.position.set(0.35, 0.55, 0.01);
  mesh.add(fold);

  mesh.position.copy(position);
  mesh.userData = { 
    initialPos: position.clone(), 
    rotSpeed: Math.random() * 0.01 + 0.005,
    floatSpeed: Math.random() * 0.002 + 0.001,
    floatOffset: Math.random() * Math.PI * 2
  };
  return mesh;
}

// Create floating icons: Lime Green, Black, White
const icon1 = createFileIcon(0xA4C639, new THREE.Vector3(-3, 2, -2));
const icon2 = createFileIcon(0x000000, new THREE.Vector3(4, -1, -3));
const icon3 = createFileIcon(0xffffff, new THREE.Vector3(-2, -3, -1));
const icon4 = createFileIcon(0xA4C639, new THREE.Vector3(3, 3, -4));

iconGroup.add(icon1, icon2, icon3, icon4);

camera.position.z = 8;

// Mouse interaction
let mouseX = 0;
let mouseY = 0;
window.addEventListener('mousemove', (event) => {
  mouseX = (event.clientX / window.innerWidth) * 2 - 1;
  mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
});

function animate() {
  requestAnimationFrame(animate);
  
  const time = Date.now() * 0.001;

  iconGroup.children.forEach(icon => {
    // Floating motion
    icon.position.y = icon.userData.initialPos.y + Math.sin(time + icon.userData.floatOffset) * 0.5;
    icon.rotation.y += icon.userData.rotSpeed;
    icon.rotation.x += icon.userData.rotSpeed * 0.5;
  });

  // Subtle parallax with mouse
  iconGroup.position.x += (mouseX * 0.5 - iconGroup.position.x) * 0.05;
  iconGroup.position.y += (mouseY * 0.5 - iconGroup.position.y) * 0.05;

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_28 -->
</body>
</html>
