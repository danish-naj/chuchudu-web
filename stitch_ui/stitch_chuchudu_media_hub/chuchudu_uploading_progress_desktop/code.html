<!DOCTYPE html>

<style>
        .neo-border { border: 4px solid #000000; }
        .neo-shadow { box-shadow: 8px 8px 0px 0px rgba(0,0,0,1); }
        .neo-shadow-sm { box-shadow: 4px 4px 0px 0px rgba(0,0,0,1); }
        .neo-hover:hover { transform: translate(4px, 4px); box-shadow: none; }
        .neo-hover-sm:hover { transform: translate(2px, 2px); box-shadow: none; }
    </style>
</head>
<body class="bg-background min-h-screen text-on-background font-body-lg">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-gutter py-4 w-full bg-background border-b-4 border-on-background shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] z-50 relative">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary font-headline-md text-headline-md font-black">bolt</span>
<span class="font-headline-md text-headline-md font-black text-primary uppercase tracking-tighter">CHUCHUDU</span>
</div>
<div class="hidden md:flex gap-4">
<button class="font-button-text text-button-text px-4 py-2 bg-primary-container text-on-primary-container neo-border shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] transition-transform active:scale-95">Transfers</button>
<button class="font-button-text text-button-text px-4 py-2 text-on-surface-variant hover:bg-surface-variant neo-border transition-colors">Files</button>
<button class="font-button-text text-button-text px-4 py-2 text-on-surface-variant hover:bg-surface-variant neo-border transition-colors">Activity</button>
</div>
<div class="flex items-center justify-center w-10 h-10 rounded-full neo-border bg-surface-variant overflow-hidden">
<span class="font-label-caps text-label-caps text-on-surface">U</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="max-w-container-max mx-auto px-gutter md:px-margin-desktop py-12 grid grid-cols-1 lg:grid-cols-12 gap-gutter min-h-[calc(100vh-80px)]">
<!-- Left Column: Overall Progress -->
<section class="lg:col-span-5 flex flex-col gap-8 h-full sticky top-32">
<div class="bg-primary-container p-8 neo-border neo-shadow flex flex-col items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#000 2px, transparent 2px); background-size: 20px 20px;"></div>
<h1 class="font-display-lg text-display-lg text-on-background font-black z-10">75%</h1>
<p class="font-headline-md text-headline-md text-on-background uppercase mt-2 z-10">Uploading...</p>
<div class="w-full mt-8 bg-surface neo-border h-12 relative overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-on-background w-[75%] transition-all duration-500 ease-out"></div>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="bg-surface p-4 neo-border neo-shadow-sm flex flex-col justify-center">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-1">Remaining</span>
<span class="font-headline-md text-headline-md text-on-background">3 Files</span>
</div>
<div class="bg-surface p-4 neo-border neo-shadow-sm flex flex-col justify-center">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-1">Time Left</span>
<span class="font-headline-md text-headline-md text-on-background">12 Mins</span>
</div>
<div class="col-span-2 bg-surface p-4 neo-border neo-shadow-sm flex justify-between items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Current Speed</span>
<span class="font-headline-md text-headline-md text-on-background text-primary">50 MB/s</span>
</div>
</div>
<button class="w-full py-4 bg-error text-on-error font-button-text text-button-text uppercase neo-border neo-shadow neo-hover transition-all mt-auto">
                Cancel All Uploads
            </button>
</section>
<!-- Right Column: Active & Queued List -->
<section class="lg:col-span-7 flex flex-col gap-6">
<h2 class="font-headline-lg text-headline-lg text-on-background mb-2 border-b-4 border-on-background pb-2">Queue (3)</h2>
<!-- Active Item 1 -->
<article class="bg-surface p-6 neo-border neo-shadow flex flex-col md:flex-row gap-4 items-center group relative overflow-hidden transition-all neo-hover">
<div class="w-16 h-16 bg-primary-container neo-border flex-shrink-0 flex items-center justify-center">
<span class="material-symbols-outlined text-on-background text-3xl">movie</span>
</div>
<div class="flex-grow w-full">
<div class="flex justify-between items-baseline mb-2">
<h3 class="font-button-text text-button-text text-on-background truncate max-w-[200px] md:max-w-md">Project_Presentation.mp4</h3>
<span class="font-label-caps text-label-caps text-on-surface-variant">1.2 GB</span>
</div>
<div class="w-full bg-tertiary-fixed neo-border h-6 relative overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-primary-container w-[85%] border-r-4 border-on-background transition-all duration-300"></div>
<span class="absolute inset-0 flex items-center justify-center font-label-caps text-label-caps mix-blend-difference text-white">85%</span>
</div>
</div>
<div class="flex gap-2 flex-shrink-0">
<button class="w-10 h-10 bg-surface neo-border flex items-center justify-center hover:bg-tertiary-fixed transition-colors" title="Pause">
<span class="material-symbols-outlined">pause</span>
</button>
<button class="w-10 h-10 bg-surface neo-border flex items-center justify-center hover:bg-error hover:text-on-error transition-colors" title="Cancel">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</article>
<!-- Active Item 2 -->
<article class="bg-surface p-6 neo-border neo-shadow flex flex-col md:flex-row gap-4 items-center group relative overflow-hidden transition-all neo-hover">
<div class="w-16 h-16 bg-primary-container neo-border flex-shrink-0 flex items-center justify-center">
<span class="material-symbols-outlined text-on-background text-3xl">folder_zip</span>
</div>
<div class="flex-grow w-full">
<div class="flex justify-between items-baseline mb-2">
<h3 class="font-button-text text-button-text text-on-background truncate max-w-[200px] md:max-w-md">Marketing_Assets_Final.zip</h3>
<span class="font-label-caps text-label-caps text-on-surface-variant">450 MB</span>
</div>
<div class="w-full bg-tertiary-fixed neo-border h-6 relative overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-primary-container w-[30%] border-r-4 border-on-background transition-all duration-300"></div>
<span class="absolute inset-0 flex items-center justify-center font-label-caps text-label-caps mix-blend-difference text-white">30%</span>
</div>
</div>
<div class="flex gap-2 flex-shrink-0">
<button class="w-10 h-10 bg-surface neo-border flex items-center justify-center hover:bg-tertiary-fixed transition-colors" title="Pause">
<span class="material-symbols-outlined">pause</span>
</button>
<button class="w-10 h-10 bg-surface neo-border flex items-center justify-center hover:bg-error hover:text-on-error transition-colors" title="Cancel">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</article>
<!-- Queued Item -->
<article class="bg-surface-variant p-6 neo-border border-dashed flex flex-col md:flex-row gap-4 items-center opacity-70 hover:opacity-100 transition-opacity">
<div class="w-16 h-16 bg-surface neo-border flex-shrink-0 flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-3xl">movie</span>
</div>
<div class="flex-grow w-full">
<div class="flex justify-between items-baseline mb-2">
<h3 class="font-button-text text-button-text text-on-background truncate max-w-[200px] md:max-w-md">Raw_Footage_01.mov</h3>
<span class="font-label-caps text-label-caps text-on-surface-variant">3.4 GB</span>
</div>
<div class="w-full bg-surface neo-border h-6 flex items-center px-2">
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-widest animate-pulse">WAITING...</span>
</div>
</div>
<div class="flex gap-2 flex-shrink-0">
<button class="w-10 h-10 bg-surface neo-border flex items-center justify-center hover:bg-error hover:text-on-error transition-colors" title="Cancel">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</article>
</section>
</main>
</body></html>
