name: macOS Desktop App Build (DMG & APP)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'desktop-agent/**'
      - '.github/workflows/desktop-macos-build.yml'

jobs:
  build-macos:
    name: Build macOS Desktop Agent
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            arch: arm64
          - target: x86_64-apple-darwin
            os: macos-13
            arch: x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop-agent/package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Desktop Dependencies
        run: |
          cd desktop-agent
          npm ci

      - name: Build macOS App & DMG
        run: |
          cd desktop-agent
          npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chuchudu-macos-${{ matrix.arch }}
          path: |
            desktop-agent/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop-agent/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          retention-days: 14

      - name: Publish DMG to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.0"
          name: "Chuchudu Desktop v1.0.0"
          draft: false
          prerelease: false
          files: |
            desktop-agent/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
